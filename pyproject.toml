[project]
name = "py-pg-dump-ui"
version = "0.2.0"
description = "Interface gráfica isolada para backup e restauração de bancos PostgreSQL (v17/v18)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "UP"]